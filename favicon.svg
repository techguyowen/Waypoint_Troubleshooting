<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="100%" stop-color="#0b0816" />
    </linearGradient>
    <linearGradient id="fader-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8b4fe" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="fader-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="fader-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Background Squircle with Purple Accent Border -->
  <rect width="32" height="32" rx="7" fill="url(#bg)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.85"/>
  <!-- Console Fader Rails -->
  <line x1="8" y1="5" x2="8" y2="27" stroke="#3b2959" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="5" x2="16" y2="27" stroke="#3b2959" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="5" x2="24" y2="27" stroke="#3b2959" stroke-width="2" stroke-linecap="round"/>
  <!-- Fader Caps: Left Cyan, Center Purple Master, Right Green -->
  <rect x="5" y="15" width="6" height="5" rx="1.5" fill="url(#fader-cyan)" stroke="#f8fafc" stroke-width="0.75"/>
  <rect x="13" y="7" width="6" height="5" rx="1.5" fill="url(#fader-purple)" stroke="#ffffff" stroke-width="0.75"/>
  <rect x="21" y="13" width="6" height="5" rx="1.5" fill="url(#fader-green)" stroke="#f8fafc" stroke-width="0.75"/>
</svg>
